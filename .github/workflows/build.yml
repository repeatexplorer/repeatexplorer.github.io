name: build and check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Hugo needs history for .GitInfo / lastmod

      - name: Set up the pinned environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: make check
        shell: bash -el {0}
        run: make check

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 7
