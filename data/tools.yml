# Canonical tool metadata. Pages reference entries by key; never repeat these
# facts in page text. Page bundles are content/tools/<key with _ as ->/.
#
# category : reads | assembly | database
# status   : active | maintained | legacy
# galaxy   : non-empty when the tool is offered on the RepeatExplorer Galaxy
#            server. Source: the `galaxy` tag in the toolkit table at
#            github.com/kavonrtep, and kavonrtep/galaxy_packages, which holds
#            the Tool Shed wrappers.
# cite     : keys into data/publications.yml. Where a tool has both a paper and
#            a Zenodo record, list both.

repeatexplorer2:
  name: RepeatExplorer2
  category: reads
  summary: Graph-based identification and quantification of repeats from unassembled sequencing reads
  repo: https://github.com/kavonrtep/repex_tarean
  galaxy: ["repeatexplorer2"]
  inputs: [sequencing reads]
  depends_on: [rexdb]
  protocols: []
  cite: [repeatexplorer2013, natprotocols2020]
  status: active

tarean:
  name: TAREAN
  category: reads
  summary: Reconstructs satellite repeat consensus sequences from RepeatExplorer2 read clusters
  repo: https://github.com/kavonrtep/repex_tarean
  galaxy: ["tarean"]
  inputs: [sequencing reads]
  depends_on: [repeatexplorer2]
  protocols: []
  cite: [tarean2017]
  status: active


dante:
  name: DANTE
  category: assembly
  summary: Domain-based annotation of transposable elements using the REXdb protein database
  repo: https://github.com/kavonrtep/dante
  galaxy: ["dante"]
  inputs: [genome assembly, sequencing reads]
  depends_on: [rexdb]
  protocols: []
  cite: [dante2024, rexdb2019]
  status: active

dante_ltr:
  name: DANTE_LTR
  category: assembly
  summary: Identifies complete LTR retrotransposons from DANTE domain hits and classifies them into lineages
  repo: https://github.com/kavonrtep/dante_ltr
  galaxy: ["dante_ltr"]
  inputs: [genome assembly]
  depends_on: [dante, rexdb]
  protocols: []
  cite: [dante2024]
  status: active

dante_tir:
  name: DANTE_TIR
  category: assembly
  summary: Finds DNA transposons with terminal inverted repeats, seeded by transposase domains
  repo: https://github.com/kavonrtep/dante_tir
  galaxy: ["dante_tir"]
  inputs: [genome assembly]
  depends_on: [dante]
  protocols: []
  cite: []
  status: active

tidecluster:
  name: TideCluster
  category: assembly
  summary: Detects tandem repeats in genome assemblies and clusters them into families
  repo: https://github.com/kavonrtep/TideCluster
  galaxy: ["tidecluster"]
  inputs: [genome assembly]
  depends_on: [tarean]
  protocols: []
  cite: [tidehunter2019, tarean2017]
  status: active

carp:
  name: CARP
  category: assembly
  summary: Integrates the annotation tools into a single non-overlapping repeat annotation of a genome
  repo: https://github.com/kavonrtep/CARP
  galaxy: ["carp"]
  inputs: [genome assembly]
  depends_on: [dante, dante_ltr, dante_tir, tidecluster]
  protocols: []
  cite: []
  status: active

rexdb:
  name: REXdb
  category: database
  summary: Reference database of transposable element protein domains, used for classification
  repo: https://github.com/repeatexplorer/rexdb
  galaxy: []
  inputs: []
  depends_on: []
  protocols: []
  cite: [rexdb2019, rexdb_zenodo]
  status: active
