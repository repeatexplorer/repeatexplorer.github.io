<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="bar">
    <a class="site-title" href="{{ "/" | relURL }}">RepeatExplorer</a>
    <nav aria-label="Main">
      <ul>
        {{ $current := . }}
        {{ range site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ else if $current.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <a class="button button-accent" href="{{ site.Params.galaxy_url }}">Open Galaxy server</a>
  </div>
</header>
