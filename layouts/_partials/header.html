<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav aria-label="Main">
    <ul>
      {{ $current := . }}
      {{ range site.Menus.main }}
        <li>
          <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ else if $current.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a>
        </li>
      {{ end }}
    </ul>
  </nav>
</header>
