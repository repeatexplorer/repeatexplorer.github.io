{{ define "main" }}
  <div class="bar">
  <article class="section-index">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "galaxy-server" }}
      <p class="galaxy-cta">
        <a class="button" href="{{ site.Params.galaxy_url }}">Open the RepeatExplorer Galaxy server</a>
      </p>
    {{ end }}
    {{ .Content }}
    {{ with .Pages }}
      <ul class="page-list">
        {{ range . }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Description }}<p>{{ . }}</p>{{ end }}
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </article>
</div>
{{ end }}
